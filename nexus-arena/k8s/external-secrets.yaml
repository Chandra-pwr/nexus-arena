# Needs External Secrets Operator. Syncs AWS Secrets Manager -> k8s Secrets used by auth-service.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: {name: aws}
spec:
  provider: {aws: {service: SecretsManager, region: ap-south-1}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: auth-jwt}
spec:
  secretStoreRef: {name: aws, kind: ClusterSecretStore}
  target: {name: auth-jwt}
  data: [{secretKey: secret, remoteRef: {key: nexus/jwt-secret}}]
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: auth-db}
spec:
  secretStoreRef: {name: aws, kind: ClusterSecretStore}
  target: {name: auth-db}
  data: [{secretKey: url, remoteRef: {key: nexus/auth-db-url}}]
