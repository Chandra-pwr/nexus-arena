server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location = /healthz { return 200 'ok'; }
  location /api/auth/        { proxy_pass http://auth-service:8080/; }
  location /api/matchmaking/ { proxy_pass http://matchmaking-service:8080/; }
  location /api/game/        { proxy_pass http://game-state-service:8080/; }
  location /api/inventory/   { proxy_pass http://inventory-service:8080/; }
  location /api/leaderboard/ { proxy_pass http://leaderboard-service:8080/; }
  location /api/chat/        { proxy_pass http://chat-service:8080/; }
  location / { try_files $uri $uri/ =404; }
}
