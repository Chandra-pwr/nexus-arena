name: services
on:
  push: {branches: [main], paths: ["services/**"]}
  pull_request: {paths: ["services/**"]}
permissions: {contents: read, packages: write}
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [auth-service, matchmaking-service, game-state-service, inventory-service, leaderboard-service, chat-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.22"}
      - name: vet and test
        working-directory: services/${{ matrix.svc }}
        run: go mod tidy && go vet ./... && go test ./...
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.svc }}
          tags: |
            type=sha
            type=raw,value=latest
      - if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with: {context: "services/${{ matrix.svc }}", push: true, tags: "${{ steps.meta.outputs.tags }}"}
