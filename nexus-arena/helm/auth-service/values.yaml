replicas: 1
image: {repository: ghcr.io/YOUR_GH_USER/nexus-arena/auth-service, tag: latest}
port: 8080
probePath: /healthz
resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 300m, memory: 256Mi}}
ingress: {enabled: false, host: ""}
env:
  - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: auth-db, key: url}}}
  - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: auth-jwt, key: secret}}}
